[package]
name = "harrys-password-manager-core-uniffi"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "harrys_password_manager_core_uniffi"

[dependencies]
harrys-password-manager-core = { path = "../..", features = ["foreign"] }
uniffi = { version = "0.29", features = ["cli"] } # Match the version of uniffi that uniffi-bindgen-react-native supports
zeroize = { version = "1.8.0", features = ["zeroize_derive"] }
thiserror = "2.0"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "build/uniffi_bindgen.rs"
